---
- name: Deploy Dashboard application
  hosts: dashboard
  become: true

  tasks:
    - name: Download Dashboard application
      ansible.builtin.get_url:
        url: https://github.com/hashicorp/demo-consul-101/releases/download/v0.0.5/dashboard-service_linux_amd64.zip
        dest: /tmp/dashboard-service.zip
        mode: "0644"

    - name: Extract Dashboard application
      ansible.builtin.unarchive:
        src: /tmp/dashboard-service.zip
        dest: /tmp
        remote_src: true
        creates: /tmp/dashboard-service_linux_amd64

    - name: Install Dashboard application binary
      ansible.builtin.copy:
        src: /tmp/dashboard-service_linux_amd64
        dest: /usr/local/bin/dashboard-service
        remote_src: true
        owner: ec2-user
        group: ec2-user
        mode: "0755"
      
    - name: Install Dashboard systemd unit file
      ansible.builtin.template:
        src: templates/dashboard.service.j2
        dest: /etc/systemd/system/dashboard-api.service
        owner: root
        group: root
        mode: "0644"
   
    - name: Enable and start Dashboard service
      ansible.builtin.systemd:
        name: dashboard-api
        daemon_reload: true
        enabled: true
        state: started

# ======================================
# Deploy Counting Application
# ======================================

- name: Deploy Counting application
  hosts: counting
  become: true

  tasks:
    - name: Download Counting application
      ansible.builtin.get_url:
        url: https://github.com/hashicorp/demo-consul-101/releases/download/v0.0.5/counting-service_linux_amd64.zip
        dest: /tmp/counting-service.zip
        mode: "0644"

    - name: Extract Counting application
      ansible.builtin.unarchive:
        src: /tmp/counting-service.zip
        dest: /tmp
        remote_src: true
        creates: /tmp/counting-service_linux_amd64

    - name: Install Counting application binary
      ansible.builtin.copy:
        src: /tmp/counting-service_linux_amd64
        dest: /usr/local/bin/counting-service
        remote_src: true
        owner: ec2-user
        group: ec2-user
        mode: "0755"
      notify: Restart Counting service

    - name: Install Counting systemd unit file
      ansible.builtin.template:
        src: templates/counting.service.j2
        dest: /etc/systemd/system/counting-api.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart Counting service

    - name: Enable and start Counting service
      ansible.builtin.systemd:
        name: counting-api
        daemon_reload: true
        enabled: true
        state: started

    - name: Verify Counting service is active
      ansible.builtin.command:
        cmd: systemctl is-active counting-api
      register: counting_status
      changed_when: false
      failed_when: counting_status.stdout != "active"

  handlers:
    - name: Restart Counting service
      ansible.builtin.systemd:
        name: counting-api
        daemon_reload: true
        state: restarted
